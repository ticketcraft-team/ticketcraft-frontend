name: Frontend CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ticketcraft-team/ticketcraft-frontend

jobs:
  # ---------------------------------------------
  # ЭТАП 1: CI (Тесты, типы, базовая сборка)
  # ---------------------------------------------
  ci:
    name: Run Checks (TypeScript & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Test production build
        run: npm run build
        env:
          VITE_API_URL: https://api.ticketcraft.app

  # ---------------------------------------------
  # ЭТАП 2: CD (Сборка Docker-образа и деплой на VPS)
  # ---------------------------------------------
  cd:
    name: Build Docker & Deploy to Server
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Логинимся в бесплатный реестр GitHub (GHCR), чтобы не регистрировать сторонний Docker Hub
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      # Сборка и отправка образа в ghcr.io
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=https://api.ticketcraft.app

      # Доставка на VPS через SSH
      - name: Deploy to VPS via SSH
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            
            # Авторизуем сервер в GHCR для скачивания приватного образа
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            # Скачиваем свежий образ
            docker pull $IMAGE_NAME
            
            # Перезапускаем контейнер
            docker stop ticketcraft-front || true
            docker rm ticketcraft-front || true
            
            docker run -d \
              --name ticketcraft-front \
              -p 3000:80 \
              --restart unless-stopped \
              $IMAGE_NAME
            
            # Очищаем старые неиспользуемые слои
            docker image prune -f